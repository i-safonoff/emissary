[project]
name = "emissary"
version = "0.1.0"
description = "An OOP client framework for external APIs -- endpoints as typed objects, retries and pagination handled once"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ivan Safonov", email = "i.safonoff.dev@gmail.com" }]
keywords = ["api-client", "httpx", "retry", "pagination", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "unicall @ git+https://github.com/i-safonoff/unicall.git@main",
]

[project.urls]
Homepage = "https://github.com/i-safonoff/emissary"
Issues = "https://github.com/i-safonoff/emissary/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-httpserver>=1.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# unicall isn't on PyPI (yet); this pulls it straight from its own repo.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/emissary"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "T20"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "live: hits a real third-party API and needs credentials",
]

[tool.coverage.run]
source = ["src/emissary"]
